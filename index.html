<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نمونه‌کارها</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Vazirmatn, Tahoma, sans-serif;
    background: #f6f8f7;
    color: #1a2b26;
    min-height: 100vh;
    padding: 48px 20px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { margin-bottom: 32px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #0d9d6e; margin-left: 10px; }
  h1 { display: inline-block; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  .sub { color: #5d6f68; font-size: 14px; margin-top: 8px; line-height: 1.8; }
  .list { display: flex; flex-direction: column; gap: 12px; }
  .card {
    display: flex; align-items: center; gap: 14px;
    background: #ffffff; border: 1px solid #e3eae6; border-radius: 14px;
    padding: 18px 20px; text-decoration: none; color: inherit;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(13,157,110,.10); border-color: #bfe3d2; }
  .num { font-size: 13px; font-weight: 800; color: #0d9d6e; font-variant-numeric: tabular-nums; }
  .ttl { flex: 1; font-size: 15px; font-weight: 700; line-height: 1.6; }
  .arr { color: #0d9d6e; font-size: 18px; }
  footer { margin-top: 40px; color: #8a998f; font-size: 12px; text-align: center; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="dot"></span><h1>نمونه‌کارها</h1>
      <p class="sub">مجموعه‌ای از صفحات وب طراحی‌شده — روی هر مورد کلیک کنید تا نسخه کامل را ببینید.</p>
    </header>
    <main class="list">
      <a class="card" href="https://epasandcom-sys.github.io/demo-pages/demos/html-css-javascript-96b012/">
        <span class="num">01</span>
        <span class="ttl">طراحی و توسعه سایت مدرن و ریسپانسیو با HTML، CSS و JavaScript</span>
        <span class="arr">↗</span>
      </a>
      <a class="card" href="https://epasandcom-sys.github.io/demo-pages/demos/demo-a50a91/">
        <span class="num">02</span>
        <span class="ttl">برنامه مدیریت، انبار محموله، فاکتور و حساب مشتری</span>
        <span class="arr">↗</span>
      </a>
      <a class="card" href="https://epasandcom-sys.github.io/demo-pages/demos/google-sheets-50566f/">
        <span class="num">03</span>
        <span class="ttl">اتوماسیون انتقال لاگ تماس به Google Sheets</span>
        <span class="arr">↗</span>
      </a>
    </main>
    <footer>epasandcom-sys</footer>
  </div>
</body>
</html>
